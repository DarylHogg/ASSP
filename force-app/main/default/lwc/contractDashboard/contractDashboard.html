<template>
    <div class="dashboard-container">

        <!-- Header -->
        <div class="dashboard-header">
            <div class="header-title">
                <lightning-icon icon-name="standard:contract" size="large" class="header-icon"></lightning-icon>
                <div>
                    <h1 class="slds-text-heading_large">Contract Tracker</h1>
                    <p class="slds-text-body_small slds-text-color_weak">
                        Upload contracts to extract and track key terms automatically.
                    </p>
                </div>
            </div>
            <div class="header-actions">
                <lightning-button
                    label="Upload Contract"
                    icon-name="utility:upload"
                    variant="brand"
                    onclick={handleUploadClick}>
                </lightning-button>
            </div>
        </div>

        <!-- Summary Tiles -->
        <template if:true={summary}>
            <div class="tile-row">
                <div class="summary-tile tile-total" onclick={handleTileClick} data-filter="All">
                    <div class="tile-value">{summary.totalContracts}</div>
                    <div class="tile-label">Total Contracts</div>
                </div>
                <div class="summary-tile tile-active" onclick={handleTileClick} data-filter="Active">
                    <div class="tile-value">{summary.activeContracts}</div>
                    <div class="tile-label">Active</div>
                </div>
                <div class="summary-tile tile-expiring" onclick={handleTileClick} data-filter="Expiring Soon">
                    <div class="tile-value">{summary.expiringSoon}</div>
                    <div class="tile-label">Expiring &lt; 90 Days</div>
                </div>
                <div class="summary-tile tile-cancellation" onclick={handleTileClick} data-filter="Cancellation Alert">
                    <div class="tile-value">{summary.cancellationDeadlineSoon}</div>
                    <div class="tile-label">Cancellation Alert</div>
                </div>
                <div class="summary-tile tile-review" onclick={handleTileClick} data-filter="Pending Review">
                    <div class="tile-value">{summary.pendingReview}</div>
                    <div class="tile-label">Pending Review</div>
                </div>
            </div>
        </template>

        <!-- Filters & Search -->
        <div class="filter-bar">
            <lightning-input
                type="search"
                label="Search contracts"
                placeholder="Vendor name or contract name..."
                value={searchTerm}
                onchange={handleSearch}
                class="search-input">
            </lightning-input>
            <lightning-combobox
                label="Status"
                value={statusFilter}
                options={statusOptions}
                onchange={handleStatusFilter}
                class="status-filter">
            </lightning-combobox>
        </div>

        <!-- Contract List -->
        <template if:true={isLoading}>
            <div class="loading-container">
                <lightning-spinner alternative-text="Loading contracts..." size="medium"></lightning-spinner>
            </div>
        </template>

        <template if:false={isLoading}>
            <template if:true={hasContracts}>
                <div class="contract-grid">
                    <template for:each={contracts} for:item="contract">
                        <c-contract-card
                            key={contract.Id}
                            contract={contract}
                            oncontractupdate={handleContractUpdate}>
                        </c-contract-card>
                    </template>
                </div>

                <!-- Pagination -->
                <template if:true={showPagination}>
                    <div class="pagination">
                        <lightning-button
                            label="Previous"
                            icon-name="utility:chevronleft"
                            onclick={handlePreviousPage}
                            disabled={isFirstPage}>
                        </lightning-button>
                        <span class="page-info">Page {pageNumber} of {totalPages} ({totalRecords} records)</span>
                        <lightning-button
                            label="Next"
                            icon-name="utility:chevronright"
                            icon-position="right"
                            onclick={handleNextPage}
                            disabled={isLastPage}>
                        </lightning-button>
                    </div>
                </template>
            </template>

            <template if:false={hasContracts}>
                <div class="empty-state">
                    <lightning-icon icon-name="utility:file" size="large" class="empty-icon"></lightning-icon>
                    <p class="slds-text-heading_small">No contracts found</p>
                    <p class="slds-text-body_regular slds-text-color_weak">
                        {emptyStateMessage}
                    </p>
                </div>
            </template>
        </template>

    </div>

    <!-- Upload Modal -->
    <template if:true={showUploadModal}>
        <section role="dialog" tabindex="-1" aria-modal="true" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">
                <header class="slds-modal__header">
                    <lightning-button-icon
                        icon-name="utility:close"
                        alternative-text="Close"
                        variant="bare-inverse"
                        onclick={closeUploadModal}
                        class="slds-modal__close">
                    </lightning-button-icon>
                    <h2 class="slds-modal__title slds-has-divider_bottom-space">Upload Contract</h2>
                </header>
                <div class="slds-modal__content slds-p-around_medium">
                    <p class="slds-text-body_regular slds-m-bottom_medium slds-text-color_weak">
                        Select a PDF, DOCX, or DOC file. Claude AI will extract the key contract terms automatically.
                    </p>
                    <lightning-input
                        type="file"
                        label="Contract file"
                        accept=".pdf,.docx,.doc"
                        onchange={handleFileChange}>
                    </lightning-input>
                    <template if:true={uploadError}>
                        <p class="slds-text-color_error slds-m-top_small">{uploadError}</p>
                    </template>
                    <template if:true={isUploading}>
                        <div class="slds-m-top_medium">
                            <lightning-spinner size="small" alternative-text="Uploading..."></lightning-spinner>
                            <span class="slds-m-left_small slds-text-body_small">Uploading and queuing for processing…</span>
                        </div>
                    </template>
                </div>
                <footer class="slds-modal__footer">
                    <lightning-button
                        label="Cancel"
                        onclick={closeUploadModal}
                        disabled={isUploading}>
                    </lightning-button>
                    <lightning-button
                        label="Upload &amp; Process"
                        variant="brand"
                        onclick={handleUploadAndProcess}
                        disabled={isUploading}
                        class="slds-m-left_x-small">
                    </lightning-button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>

</template>
